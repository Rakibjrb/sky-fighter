<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Fighter Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="game_over hidden">
        Game Over
        <br />
        Start Again
      </div>
      <div class="score_container">
        <div class="display score">Destroyed : 0</div>
        <div class="display score">Previous Destroyed : 0</div>
        <div class="display score">Health : 100%</div>
      </div>

      <canvas id="game"></canvas>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
